# R36LLM defaults.
model=Ternary-Bonsai-2-2B-PTQ1_0.gguf
threads=4
ctx=2048
max_tokens=256
temp=0.5
top_p=0.9
top_k=20
system=You are a tiny AI living inside an R36S handheld game console. Answer briefly.
swap_p2=1
# Screen brightness in percent (10-100); also F + Up/Down on the device.
brightness=80
# Minutes without input before the screen turns off (0 = never). Power key toggles it.
screen_timeout=2
# performance, balanced (ondemand) or saver (powersave).
cpu_mode=performance
# PC link: ethernet (USB adapter), gadget (experimental), or off.
link=ethernet
# Used only with link=gadget.
usb_gadget_fn=ncm
