# U-Boot v2025.10 script SOURCE for the spare-card mainline experiment.
# Compile with: mkimage -A arm64 -O linux -T script -C none -n r36llm-mainline -d boot.ini boot.scr
# Install boot.scr (not just this text) at the root of the FAT boot partition.
# Arch R's bootflow scanner supplies devtype, devnum and distro_bootpart.
# Fixed eeclone board selection avoids the upstream ADC-based fallback to another board.

if test "${devtype}" != "mmc"; then
    echo "r36llm: this draft only boots an MMC spare card"
    exit
fi
if test -z "${devnum}" || test -z "${distro_bootpart}"; then
    echo "r36llm: missing bootflow device or partition"
    exit
fi

# Addresses are for the 1 GiB RK3326 target; check Image/initrd sizes before hardware boot.
# Keep DTB + 256 KiB overlay growth below overlay, overlay below Image, initrd at 512 MiB.
setenv kernel_addr_r 0x09000000
setenv fdt_addr_r 0x02000000
setenv fdtoverlay_addr_r 0x08000000
setenv ramdisk_addr_r 0x20000000
setenv bootargs "console=ttyS2,115200 console=tty1 loglevel=7 rdinit=/init consoleblank=0 vt.global_cursor_default=0 net.ifnames=0"

# Load and apply the exact board overlay before booting. Never boot the generic default panel.
if load mmc ${devnum}:${distro_bootpart} ${kernel_addr_r} /Image && load mmc ${devnum}:${distro_bootpart} ${fdt_addr_r} /dtbs/rk3326-gameconsole-eeclone.dtb && load mmc ${devnum}:${distro_bootpart} ${fdtoverlay_addr_r} /overlays/mipi-panel.dtbo && load mmc ${devnum}:${distro_bootpart} ${ramdisk_addr_r} /uInitrd; then
    if fdt addr ${fdt_addr_r} && fdt resize 0x40000 && fdt apply ${fdtoverlay_addr_r}; then
        # uInitrd is a legacy-wrapped gzip cpio: pass its header address, NOT address:filesize.
        # U-Boot must have CONFIG_LEGACY_IMAGE_FORMAT=y as well as booti and libfdt overlay support.
        booti ${kernel_addr_r} ${ramdisk_addr_r} ${fdt_addr_r}
        echo "r36llm: booti returned without starting Linux"
    else
        echo "r36llm: DTB/Panel 8 overlay application failed; refusing to boot"
    fi
else
    echo "r36llm: required boot file missing or unreadable; refusing to boot"
fi
