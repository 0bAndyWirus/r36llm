image boot.vfat {
    vfat {
        label = "R36BOOT"
        extraargs = "-F 32"
        file Image { image = "Image" }
        file uInitrd { image = "uInitrd" }
        file rk3326-r36s-linux.dtb { image = "rk3326-r36s-linux.dtb" }
        file rg351v-uboot.dtb { image = "rg351v-uboot.dtb" }
        file boot.ini { image = "boot.ini" }
        file logo.bmp { image = "logo.bmp" }
        file battery_0.bmp { image = "battery_0.bmp" }
        file battery_1.bmp { image = "battery_1.bmp" }
        file battery_2.bmp { image = "battery_2.bmp" }
        file battery_3.bmp { image = "battery_3.bmp" }
        file battery_4.bmp { image = "battery_4.bmp" }
        file battery_5.bmp { image = "battery_5.bmp" }
        file battery_fail.bmp { image = "battery_fail.bmp" }
        file r36-grow.txt { image = "grow-boot.txt" }
    }
    size = 128M
}
image data.vfat {
    vfat {
        label = "R36DATA"
        extraargs = "-F 32"
        file r36-grow.txt { image = "grow-data.txt" }
    }
    size = 128M
}
image r36llm.img {
    hdimage {
        partition-table-type = "mbr"
        disk-signature = 0x52333653
    }
    size = 800M
    partition idbloader {
        in-partition-table = "no"
        image = "idbloader.img"
        offset = 32K
    }
    partition uboot {
        in-partition-table = "no"
        image = "uboot.img"
        offset = 8M
    }
    partition trust {
        in-partition-table = "no"
        image = "trust.img"
        offset = 12M
    }
    partition boot {
        partition-type = 0x0c
        bootable = "true"
        image = "boot.vfat"
        offset = 16M
        size = 128M
    }
    partition swap {
        partition-type = 0x82
        image = "swap.img"
        size = 512M
    }
    partition data {
        partition-type = 0x0c
        image = "data.vfat"
        size = 128M
    }
    # hdimage otherwise stops at the last partition (784 MiB), ignoring size.
    partition padding {
        in-partition-table = "no"
        image = "padding.bin"
        offset = 784M
        size = 16M
        fill = "true"
    }
}
